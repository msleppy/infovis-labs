<h2>Activity 1: SVG Shapes </h2>

<!-- circle -->
 <h3>Circle</h3>
<svg width="200" height="100">
  <circle cx="50" cy="50" r="30" fill="steelblue"></circle>
</svg>

<!-- five circles stacked vertically -->
 <h3>Circles</h3>
<svg width="200" height="300">
  <circle cx="50" cy="30" r="20" fill="tomato"></circle>
  <circle cx="50" cy="80" r="20" fill="orange"></circle>
  <circle cx="50" cy="130" r="20" fill="violet"></circle>
  <circle cx="50" cy="180" r="20" fill="mediumseagreen"></circle>
  <circle cx="50" cy="230" r="20" fill="dodgerblue"></circle>
</svg>

<!-- five rectangles stacked horizontally -->
 <h3>Rectangles</h3>
<svg width="400" height="100">
  <rect x="10"  y="20" width="50" height="50" fill="purple"></rect>
  <rect x="70"  y="20" width="50" height="50" fill="violet"></rect>
  <rect x="130" y="20" width="50" height="50" fill="cyan"></rect>
  <rect x="190" y="20" width="50" height="50" fill="tomato"></rect>
  <rect x="250" y="20" width="50" height="50" fill="slateblue"></rect>
</svg>

<!-- five elements with different shapes and colors -->
 <h3>Shapes</h3>
<svg width="400" height="120">
  <circle cx="50" cy="60" r="30" fill="tomato"></circle>
  <rect x="100" y="30" width="60" height="60" fill="indigo"></rect>
  <ellipse cx="220" cy="60" rx="30" ry="20" fill="mediumseagreen"></ellipse>
  <line x1="260" y1="20" x2="320" y2="100"
        stroke="firebrick" stroke-width="4"></line>
  <polygon points="360,20 390,100 330,100" fill="palevioletred"></polygon>
</svg>
