<!DOCTYPE html>
<html>
<head>
    <title>Madison's Activity 4 Webpage</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h2>JavaScript Interaction</h2>

    <button onclick="showAlert()">Click for Alert</button>

    <button id="colorBtn">Change My Color</button>

    <br><br>

    <input id="textInput" placeholder="Type here...">

    <h1 id="outputText"></h1>

    <script>
        function showAlert() {
            alert("Button clicked! Have a good day!");
        }

        const colorBtn = document.getElementById("colorBtn");
        const colors = ["red", "skyblue", "green", "orange", "yellow", "cyan", "white", "fuchsia",];
        colorBtn.addEventListener("click", function() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            this.style.backgroundColor = randomColor;
        });

        const textInput = document.getElementById("textInput");
        const outputText = document.getElementById("outputText");
        textInput.addEventListener("input", function() {
            outputText.textContent = this.value;
        });
    </script>
</body>
</html>
